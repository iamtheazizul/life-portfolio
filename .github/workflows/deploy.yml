      - name: Build
        run: npm run build
        env:
          VITE_CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          VITE_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}

      - name: Debug - Check env vars loaded
        run: |
          echo "Space ID length: ${#VITE_CONTENTFUL_SPACE_ID}"
          echo "Access Token length: ${#VITE_CONTENTFUL_ACCESS_TOKEN}"
          if [ -z "$VITE_CONTENTFUL_SPACE_ID" ]; then
            echo "ERROR: VITE_CONTENTFUL_SPACE_ID is empty!"
          else
            echo "OK: VITE_CONTENTFUL_SPACE_ID is set"
          fi
        env:
          VITE_CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          VITE_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}