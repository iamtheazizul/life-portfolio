- name: Debug - Compare values
        run: |
          echo "Space ID: $VITE_CONTENTFUL_SPACE_ID"
          echo "Token first 10 chars: ${VITE_CONTENTFUL_ACCESS_TOKEN:0:10}"
        env:
          VITE_CONTENTFUL_SPACE_ID: ${{ secrets.VITE_CONTENTFUL_SPACE_ID }}
          VITE_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.VITE_CONTENTFUL_ACCESS_TOKEN }}